<script>
document.addEventListener('DOMContentLoaded', function () {
    const svg = document.getElementById('contributionSvg');
    const readout = document.getElementById('contributionReadout');
    if (!svg || !readout) return;

    const readoutDate = readout.querySelector('.contribution-readout-date');
    const readoutCount = readout.querySelector('.contribution-readout-count');
    const NS = 'http://www.w3.org/2000/svg';

    const W = 640;
    const H = 420;
    const CX = W / 2;
    const CY = H / 2 + 6;
    const TURNS = 3.35;
    const THETA_MAX = TURNS * Math.PI * 2;
    const R_INNER = 14;
    const R_OUTER = Math.min(W, H) * 0.42;

    const formatDate = (iso) => {
        const date = new Date(iso + 'T00:00:00');
        return date.toLocaleDateString('en-GB', {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
        });
    };

    const setReadout = (dateText, countText, active) => {
        readoutDate.textContent = dateText;
        readoutCount.textContent = countText;
        readout.classList.toggle('is-active', !!active);
    };

    const dayPoint = (index, total) => {
        const t = total <= 1 ? 0 : (index / (total - 1)) * THETA_MAX;
        const r = R_INNER + (R_OUTER - R_INNER) * (t / THETA_MAX);
        // Start at top; wind clockwise through the year
        const angle = t - Math.PI / 2;
        return {
            x: CX + r * Math.cos(angle),
            y: CY + r * Math.sin(angle),
            angle,
            r,
            t,
        };
    };

    const el = (name, attrs = {}) => {
        const node = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) => {
            if (value !== undefined && value !== null) node.setAttribute(key, value);
        });
        return node;
    };

    const render = (payload) => {
        const days = payload.days || [];
        if (!days.length) return;

        document.getElementById('contributionTotal').textContent = payload.total.toLocaleString();
        document.getElementById('contributionActive').textContent = payload.active_days.toLocaleString();
        const bestEl = document.getElementById('contributionBest');
        if (payload.best) {
            bestEl.textContent = String(payload.best.count);
            bestEl.title = formatDate(payload.best.date);
        } else {
            bestEl.textContent = '—';
        }
        document.getElementById('contributionYear').textContent = String(payload.year);

        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        svg.innerHTML = '';

        const defs = el('defs');
        defs.innerHTML = `
            <filter id="contributionGlow" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="1.4" result="blur"/>
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <radialGradient id="contributionCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#313396" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#313396" stop-opacity="0"/>
            </radialGradient>
        `;
        svg.appendChild(defs);

        // Soft core — year nucleus
        svg.appendChild(el('circle', {
            cx: CX,
            cy: CY,
            r: 28,
            fill: 'url(#contributionCore)',
            class: 'contribution-core-glow',
        }));
        const yearMark = el('text', {
            x: CX,
            y: CY + 4,
            class: 'contribution-core-label',
            'text-anchor': 'middle',
        });
        yearMark.textContent = String(payload.year).slice(2);
        svg.appendChild(yearMark);

        const points = days.map((day, index) => {
            const pos = dayPoint(index, days.length);
            return { ...day, ...pos, index };
        });

        // Arm path — the year as one continuous orbit
        const arm = el('path', { class: 'contribution-arm' });
        let armD = '';
        points.forEach((p, i) => {
            armD += `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(2)} ${p.y.toFixed(2)} `;
        });
        arm.setAttribute('d', armD.trim());
        svg.appendChild(arm);

        // Burst filaments — connect nearby high-activity days into unique "work constellations"
        const hot = points.filter((p) => p.level >= 3);
        const filaments = el('g', { class: 'contribution-filaments' });
        hot.forEach((a, i) => {
            for (let j = i + 1; j < hot.length; j++) {
                const b = hot[j];
                if (b.index - a.index > 10) break;
                const dx = a.x - b.x;
                const dy = a.y - b.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 54) continue;
                filaments.appendChild(el('line', {
                    x1: a.x,
                    y1: a.y,
                    x2: b.x,
                    y2: b.y,
                    class: 'contribution-filament',
                }));
            }
        });
        svg.appendChild(filaments);

        // Month labels along the arm
        let lastMonth = -1;
        points.forEach((p) => {
            const month = new Date(p.date + 'T00:00:00').getMonth();
            if (month === lastMonth) return;
            lastMonth = month;
            const labelR = p.r + 14;
            const lx = CX + labelR * Math.cos(p.angle);
            const ly = CY + labelR * Math.sin(p.angle);
            const text = el('text', {
                x: lx,
                y: ly,
                class: 'contribution-month-label',
                'text-anchor': 'middle',
                'dominant-baseline': 'middle',
            });
            text.textContent = new Date(p.date + 'T00:00:00')
                .toLocaleDateString('en-GB', { month: 'short' });
            svg.appendChild(text);
        });

        const stars = el('g', { class: 'contribution-stars' });
        const hitAreas = el('g', { class: 'contribution-hits' });

        const clearHot = () => {
            stars.querySelectorAll('.is-hot, .is-near').forEach((node) => {
                node.classList.remove('is-hot', 'is-near');
            });
        };

        points.forEach((day) => {
            const level = day.level || 0;
            const radius = level === 0 ? 1.15 : 1.5 + level * 1.35;
            const star = el('circle', {
                cx: day.x,
                cy: day.y,
                r: radius,
                class: `contribution-star level-${level}`,
            });
            star.style.setProperty('--delay', `${Math.round(day.index * 3.2)}ms`);
            if (day.index === points.length - 1) {
                star.classList.add('is-today');
            }
            stars.appendChild(star);

            // Invisible larger hit target for easier hovering on the spiral
            const hit = el('circle', {
                cx: day.x,
                cy: day.y,
                r: Math.max(7, radius + 4),
                class: 'contribution-hit',
            });
            hit.addEventListener('mouseenter', () => {
                clearHot();
                star.classList.add('is-hot');
                points.forEach((other) => {
                    if (Math.abs(other.index - day.index) > 0 && Math.abs(other.index - day.index) <= 3) {
                        const near = stars.children[other.index];
                        if (near) near.classList.add('is-near');
                    }
                });
                const label = day.count === 1 ? '1 contribution' : `${day.count} contributions`;
                setReadout(formatDate(day.date), label, true);
            });
            hit.addEventListener('mouseleave', () => {
                clearHot();
                setReadout('Trace the spiral', '', false);
            });
            hitAreas.appendChild(hit);
        });

        svg.appendChild(stars);
        svg.appendChild(hitAreas);

        // Animate arm draw length
        const armLength = arm.getTotalLength();
        arm.style.strokeDasharray = String(armLength);
        arm.style.strokeDashoffset = String(armLength);

        setReadout('Trace the spiral', '', false);
        requestAnimationFrame(() => {
            svg.classList.add('is-drawn');
            arm.style.strokeDashoffset = '0';
        });
    };

    fetch('https://ir8x.vercel.app/contribution')
        .then((response) => response.json())
        .then((data) => {
            if (!data || !Array.isArray(data.days)) {
                console.error('Unexpected /contribution response:', data);
                return;
            }
            render(data);
        })
        .catch((error) => {
            console.error('Error fetching contribution data:', error);
        });
});
</script>
